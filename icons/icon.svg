<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Silesthe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79ce8"/>
      <stop offset="1" stop-color="#7c5cbf"/>
    </linearGradient>
    <linearGradient id="soap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7fb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background with large rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Soft glow behind the soap bar (within safe zone) -->
  <ellipse cx="256" cy="300" rx="150" ry="96" fill="#ffffff" opacity="0.12"/>

  <!-- Stylized soap bar -->
  <rect x="138" y="232" width="236" height="138" rx="40" ry="40" fill="url(#soap)"/>
  <!-- Subtle top sheen on the bar -->
  <rect x="138" y="232" width="236" height="58" rx="40" ry="40" fill="#ffffff" opacity="0.55"/>
  <!-- Light lilac edge accent -->
  <rect x="138" y="232" width="236" height="138" rx="40" ry="40" fill="none" stroke="#d9c6f5" stroke-width="6" opacity="0.7"/>

  <!-- Foam bubbles rising from the bar -->
  <circle cx="206" cy="206" r="40" fill="#fff7fb"/>
  <circle cx="266" cy="172" r="28" fill="#fff7fb"/>
  <circle cx="318" cy="206" r="22" fill="#e9defb"/>
  <!-- Tiny highlights on the bubbles -->
  <circle cx="192" cy="192" r="11" fill="#ffffff" opacity="0.85"/>
  <circle cx="258" cy="164" r="8" fill="#ffffff" opacity="0.85"/>

  <!-- Little heart on the soap bar (a gift) -->
  <path d="M256 350
           c-14 -16 -42 -28 -42 -52
           a22 22 0 0 1 42 -10
           a22 22 0 0 1 42 10
           c0 24 -28 36 -42 52 Z"
        fill="#9a78d6"/>
  <!-- Soft heart highlight -->
  <circle cx="240" cy="296" r="7" fill="#ffffff" opacity="0.5"/>
</svg>
